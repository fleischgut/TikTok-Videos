<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IDB;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf)}
@font-face{font-family:IDX;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-ExtraBold.otf)}
@font-face{font-family:IB;src:url(file:///usr/share/fonts/opentype/inter/Inter-Bold.otf)}
html,body{margin:0;width:1080px;height:1920px;background:#000;overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden;background:#000}
#glow{position:absolute;inset:0;background:radial-gradient(ellipse 80% 45% at 50% 52%,rgba(204,34,38,.55),rgba(204,34,38,0) 70%)}
#stripes{position:absolute;left:-600px;top:-600px;width:2400px;height:3200px;
 background:repeating-linear-gradient(-35deg,rgba(251,124,131,.06) 0 40px,transparent 40px 120px)}
#logo{position:absolute;left:360px;top:795px;width:356px;height:256px;transform-origin:50% 50%}
#logo img{width:100%;height:100%}
#grp{position:absolute;inset:0;transform-origin:50% 50%}
.line{position:absolute;left:0;right:0;text-align:center;white-space:nowrap}
#need{top:800px;font:900 140px/1 IDB;color:#fff;letter-spacing:6px;overflow:hidden;height:160px}
#need span{display:inline-block}
#cat{top:955px;font:900 150px/1 IDB;color:#fb7c83;letter-spacing:-1px}
#cat span{display:inline-block}
#bar{position:absolute;top:1130px;left:190px;height:12px;width:700px;background:#cc2226;transform-origin:0 50%}
#tick{position:absolute;top:1180px;left:50%;height:96px;transform:translateX(-50%);overflow:hidden;
 border:4px solid #fff;border-radius:60px;padding:0 44px;box-sizing:border-box}
#tick .w{position:absolute;left:0;right:0;top:0;height:88px;font:800 54px/92px IDX;color:#fff;text-align:center;letter-spacing:3px}
#btnwrap{position:absolute;top:1355px;left:50%;width:860px;height:170px;margin-left:-430px}
.ring{position:absolute;inset:0;border-radius:100px;border:6px solid #fb7c83}
#btn{position:absolute;inset:0;border-radius:100px;background:#fff;display:flex;align-items:center;justify-content:center;gap:30px;overflow:hidden;
 box-shadow:0 20px 60px rgba(204,34,38,.6)}
#btn .t{font:900 64px/1 IDB;color:#111;letter-spacing:1px}
#btn .t b{color:#cc2226}
#ico{width:92px;height:92px;border-radius:50%;background:#cc2226;display:flex;align-items:center;justify-content:center}
#shine{position:absolute;top:-20px;bottom:-20px;width:140px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.0),rgba(251,124,131,.55),transparent);transform:skewX(-20deg)}
#sub{top:1568px;font:700 44px/1.3 IB;color:#fff}
#sub em{font-style:normal;color:#fb7c83}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body><div id="stage">
<div id="glow"></div><div id="stripes"></div>
<div id="grp">
 <div id="logo"><img src="logo.png"></div>
 <div class="line" id="need"></div>
 <div class="line" id="cat"></div>
 <div id="bar"></div>
 <div id="tick"></div>
 <div id="btnwrap"><div class="ring" id="r1"></div><div class="ring" id="r2"></div>
  <div id="btn"><div id="ico"><svg width="52" height="52" viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></div>
  <div class="t">CALL <b>FLEISCHGUT</b></div><div id="shine"></div></div></div>
 <div class="line" id="sub">Jetzt anfragen &ndash; <em>DM</em> oder <em>Link in Bio</em></div>
</div>
<div id="flash"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,s,d)=>cl((t-s)/d);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const back=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const elastic=x=>x===0?0:x===1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*Math.PI)/3)+1;
const mk=(el,txt)=>{for(const ch of txt){const s=document.createElement('span');s.textContent=ch===' '?' ':ch;el.appendChild(s)}return [...el.children]};
const needS=mk($('need'),'NEED');
const catS=mk($('cat'),'CATERING?');
const words=['HOCHZEITEN','FIRMENFEIERN','GEBURTSTAGE','STREETFOOD-EVENTS','100% HALAL · FRISCH'];
const wEls=words.map(w=>{const d=document.createElement('div');d.className='w';d.textContent=w;$('tick').appendChild(d);return d});
// measure widths for pill
const meas=document.createElement('span');meas.style.cssText='position:absolute;visibility:hidden;font:800 54px IDX;letter-spacing:3px';document.body.appendChild(meas);
const ww=words.map(w=>{meas.textContent=w;return meas.offsetWidth+88+8});
function render(t){
 // background
 $('glow').style.opacity=eo(p(t,.2,1))*(0.85+0.15*Math.sin(t*3));
 $('stripes').style.transform=`translateX(${(t*60)%120}px)`;
 $('stripes').style.opacity=eo(p(t,.3,.8));
 // logo: from original spot up
 const lp=eio(p(t,0,.7));
 $('logo').style.transform=`translateY(${-360*lp}px) scale(${1-0.05*lp+0.06*Math.sin(Math.PI*lp)})`;
 // NEED: slide up per letter
 needS.forEach((s,i)=>{const k=back(p(t,.45+i*.05,.35));s.style.transform=`translateY(${(1-k)*170}px)`});
 // CATERING?: slam letters
 catS.forEach((s,i)=>{const q=p(t,.7+i*.035,.32);const k=back(q);
  s.style.opacity=cl(q*4);s.style.transform=`scale(${2.4-1.4*k}) rotate(${(1-k)*(i%2?14:-14)}deg)`;s.style.filter=`blur(${(1-cl(q*1.6))*12}px)`});
 // underline bar
 $('bar').style.transform=`scaleX(${eo(p(t,1.05,.4))})`;
 // flash + shake on impact
 const fi=p(t,1.0,.18);$('flash').style.opacity=fi>0&&fi<1?0.22*(1-fi):0;
 const sh=p(t,1.0,.35);const amp=sh>0&&sh<1?(1-sh)*16:0;
 // ticker
 const T0=1.35,dt=.36;
 let idx=cl(Math.floor((t-T0)/dt),0,words.length-1);
 const tp=p(t,T0-.15,.3);
 $('tick').style.opacity=tp;$('tick').style.transform=`translateX(-50%) scale(${.6+.4*back(tp)})`;
 // pill width interpolation
 let wcur=ww[0];
 wEls.forEach((e,i)=>{const st=T0+i*dt;const inn=eo(p(t,st-.12,.16));const out=i<words.length-1?eo(p(t,st+dt-.12,.16)):0;
  e.style.transform=`translateY(${(1-inn)*90-out*90}px)`;e.style.opacity=inn*(1-out);
  if(t>=st-.12) wcur=ww[i-1]!==undefined?ww[i-1]+(ww[i]-ww[i-1])*inn:ww[i];});
 $('tick').style.width=wcur+'px';
 const fin=t>T0+dt*(words.length-1);
 $('tick').style.background=fin?'#cc2226':'transparent';
 $('tick').style.borderColor=fin?'#cc2226':'#fff';
 // button
 const bp=p(t,3.0,.55);const bk=elastic(bp);
 const pulse=t>3.6?1+0.035*Math.sin((t-3.6)*Math.PI*2*1.1):1;
 $('btnwrap').style.transform=`scale(${bk*pulse})`;$('btnwrap').style.opacity=cl(bp*5);
 [['r1',0],['r2',.55]].forEach(([id,o])=>{const c=t>3.4?(((t-3.4+o)%1.1)/1.1):-1;const r=$(id);
  r.style.opacity=c<0?0:(1-c)*.9;r.style.transform=`scale(${1+c*0.18},${1+c*0.5})`});
 const sp=t>3.5?(((t-3.5)%1.4)/1.4):0;$('shine').style.left=(-200+sp*1200)+'px';
 // sub
 const sb=eo(p(t,3.5,.45));$('sub').style.opacity=sb;$('sub').style.transform=`translateY(${(1-sb)*40}px)`;
 // group drift + shake
 const sx=amp*Math.sin(t*173),sy=amp*Math.cos(t*211);
 $('grp').style.transform=`translate(${sx}px,${sy}px) scale(${1+0.012*p(t,1.2,4.4)})`;
}
window.render=render;render(0);
</script></body></html>
