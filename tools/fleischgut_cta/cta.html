<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IDB;src:url(file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf)}
html,body{margin:0;width:1080px;height:1920px;background:#000;overflow:hidden}
.ln{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;font:900 120px/1 IDB;color:#fff;letter-spacing:2px}
.m{display:inline-block;overflow:hidden;vertical-align:top;padding:6px 0 10px}
.m>span{display:inline-block}
#a1{top:760px}#a2{top:900px}
#b1{top:760px}#b2{top:900px}
.L{position:absolute;left:362px;width:356px;transform-origin:178px 0}
#lw,#li,#lc{position:absolute;left:0;top:0;width:1080px;height:1920px}
#lw img,#li img,#lc img{position:absolute;left:184px;width:712px}
</style></head><body>
<div class="ln" id="a1"><span class="m"><span id="w1">NEED</span></span> <span class="m"><span id="w2">A</span></span></div>
<div class="ln" id="a2"><span class="m"><span id="w3">CATERING?</span></span></div>
<div class="ln" id="b1"><span class="m"><span id="w4">CALL</span></span></div>
<div class="ln" id="b2"><span class="m"><span id="w5"><span id="fg" style="display:inline-block">FLEISCHGUT</span><span id="dot">.</span></span></span></div>
<div id="li"><img src="l_icon.png" style="top:672px"></div>
<div id="lw"><img src="l_word.png" style="top:954px"></div>
<div id="lc"><img src="l_celik.png" style="top:1064px"></div>
<script>
// final logo: scale 2, top-left (184,672); icon rows 0-141 -> y 672..954; word 141..196 -> 954..1064; celik -> 1064..1184
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,s,d)=>cl((t-s)/d);
const expo=x=>x===1?1:1-Math.pow(2,-10*x);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const quint=x=>x<.5?16*x**5:1-Math.pow(-2*x+2,5)/2;
const reveal=(el,t,s,out)=>{const i=expo(p(t,s,.7));const o=out===undefined?0:eio(p(t,out,.45));
 el.style.transform=`translateY(${(1-i)*140 - o*140}px)`;};
// wordmark target rect (letters at x16..339,y145..184 of logo => *2 + offset)
const TX0=184+16*2,TX1=184+339*2,TY0=672+145*2,TY1=672+184*2;
let fr0=null;
function render(t){
 reveal($('w1'),t,.25,1.95);reveal($('w2'),t,.33,1.99);reveal($('w3'),t,.45,2.03);
 reveal($('w4'),t,2.3);reveal($('w5'),t,2.4);
 [$('a1'),$('a2')].forEach(e=>e.style.visibility=t<2.6?'visible':'hidden');
 // CALL and dot leave
 const lv=eio(p(t,3.6,.5));
 $('w4').style.opacity=1-lv;$('w4').style.filter=`blur(${lv*10}px)`;
 $('dot').style.opacity=1-eio(p(t,3.6,.3));
 // morph FLEISCHGUT -> wordmark
 const fg=$('fg');
 const m=quint(p(t,3.75,.85));
 const BX=132.906,BY=906.368, ix0=138,iy0=920,ix1=908,iy1=1010, X0=217,Y0=964,X1=862,Y1=1040;
 const sx=1+((X1-X0)/(ix1-ix0)-1)*m, sy=1+((Y1-Y0)/(iy1-iy0)-1)*m;
 const ex=ix0+(X0-ix0)*m, ey=iy0+(Y0-iy0)*m;
 fg.style.transformOrigin='0 0';
 fg.style.transform=`translate(${ex-BX-sx*(ix0-BX)}px,${ey-BY-sy*(iy0-BY)}px) scale(${sx},${sy})`;
 const cf=eio(p(t,4.45,.3));
 fg.style.opacity=1-cf; $('lw').style.opacity=cf;
 $('w5').parentElement.style.overflow=t>3.7?'visible':'hidden';
 // icon + celik
 const ic=expo(p(t,4.35,.9));
 $('li').style.opacity=cl(p(t,4.35,.45));$('li').style.transform=`translateY(${(1-ic)*40}px) scale(${.92+.08*ic})`;$('li').style.transformOrigin='540px 813px';
 const ce=expo(p(t,4.65,.8));
 $('lc').style.opacity=cl(p(t,4.65,.45));$('lc').style.transform=`translateY(${(1-ce)*-20}px)`;
 // very subtle global push-in at end
 const z=1;
 ['li','lw','lc'].forEach(id=>{const e=$(id);e.style.scale=z;e.style.transformOrigin='540px 928px'});
}
window.render=render;
</script></body></html>
